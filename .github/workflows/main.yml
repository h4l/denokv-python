name: "Main"
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  prepare_checks:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.generate.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List targets
        id: generate
        uses: docker/bake-action/subaction/list-targets@3fc70e1131fee40a422dd8dd0ff22014ae20a1f3 # v5
        with:
          target: default
          files: docker-bake.hcl

  run_check:
    runs-on: ubuntu-latest
    needs:
      - prepare_checks
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare_checks.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check
        uses: docker/bake-action@3fc70e1131fee40a422dd8dd0ff22014ae20a1f3 # v5
        with:
          targets: ${{ matrix.target }}
          files: docker-bake.hcl
